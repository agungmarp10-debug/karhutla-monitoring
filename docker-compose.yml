x-airflow-common: &airflow-common
  build: .
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Jakarta

    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}

    NASA_FIRMS_MAP_KEY: ${NASA_FIRMS_MAP_KEY}

    PYTHONPATH: /opt/airflow/scripts

  volumes:
    - ./dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - ./sql:/opt/airflow/sql
    - ./data:/opt/airflow/data
    - airflow_logs:/opt/airflow/logs


services:

  postgres:
    image: postgres:16
    container_name: karhutla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5


  metabase-db-init:
    image: postgres:16
    container_name: karhutla-metabase-db-init
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      METABASE_DB: ${METABASE_DB:-metabase_db}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
    command:
      - |
        set -e
        if [ "$$(psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$METABASE_DB'")" != "1" ]; then
          createdb "$$METABASE_DB"
        fi
        echo "Metabase application database ready."


  metabase:
    image: metabase/metabase:latest
    container_name: karhutla-metabase
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB:-metabase_db}
      MB_DB_PORT: "5432"
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
    ports:
      - "3000:3000"
    depends_on:
      metabase-db-init:
        condition: service_completed_successfully


  airflow-db-init:
    image: postgres:16
    container_name: karhutla-airflow-db-init
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW_DB: ${AIRFLOW_DB}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
    command:
      - |
        set -e
        if [ "$$(psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$AIRFLOW_DB'")" != "1" ]; then
          createdb "$$AIRFLOW_DB"
        fi
        echo "Airflow metadata database ready."


  airflow-init:
    <<: *airflow-common
    container_name: karhutla-airflow-init
    depends_on:
      airflow-db-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    command: version


  airflow-webserver:
    <<: *airflow-common
    container_name: karhutla-airflow-webserver
    restart: unless-stopped
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully


  airflow-scheduler:
    <<: *airflow-common
    container_name: karhutla-airflow-scheduler
    restart: unless-stopped
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully


volumes:
  postgres_data:
  airflow_logs:

